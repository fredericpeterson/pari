name: Scores football

on:
  schedule:
    - cron: '15 */3 * * *'   # toutes les 3 heures (l'heure exacte peut varier)
  workflow_dispatch:          # lancement manuel depuis l'onglet Actions

permissions:
  contents: write

concurrency:
  group: scores
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Récupérer les scores
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: node .github/scripts/fetch-scores.mjs
      - name: Publier results.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results.json scores.txt
          git diff --cached --quiet || (git commit -m "scores: mise à jour automatique" && git push)
